[package]
# The crates.io name is `dogdns` because `dog` is taken (an abandoned Datadog client). The installed
# binary is still `dog`: see [[bin]] below. Nothing in the source reads the package name.
name = "dogdns"
description = "A command-line DNS client, like dig but friendlier: colourful output, simple arguments, DNS-over-TLS, DNS-over-HTTPS, JSON output and 35 record types"

authors = ["Benjamin Sago <ogham@bsago.me>"]
categories = ["command-line-utilities", "network-programming"]
keywords = ["dns", "dig", "dns-over-https", "dns-over-tls", "resolver"]
edition = "2018"
repository = "https://github.com/l1a/dog"
homepage = "https://github.com/l1a/dog"
readme = "README.md"
exclude = [
    "/.github", "/.copr", "/packaging", "/scripts",
    "/completions/*", "/man/*", "/xtests/*",
    "/dog-screenshot.png", "/dog.code-workspace", "/Justfile",
    "/AGENTS.md", "/CLAUDE.md", "/CONTRIBUTING.md", "/.rustfmt.toml",
]
license = "GPL-3.0-or-later"
version = "0.7.6"


[[bin]]
name = "dog"
path = "src/main.rs"
doctest = false


# make dev builds faster by excluding debug symbols
[profile.dev]
debug = false
incremental = true
codegen-units = 16
opt-level = 0

# use LTO for smaller binaries (that take longer to build)
[profile.release]
lto = true
overflow-checks = true
panic = "abort"


[dependencies]
hickory-resolver = { version = "0.26.1", features = ["tls-ring", "https-ring", "webpki-roots"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

# command-line
anstyle = "1.0"
clap = "4"


# json output (preserve_order keeps keys in insertion order, which is the output's documented shape)
serde_json = { version = "1", features = ["preserve_order"] }

# async utilities
futures = "0.3"

# logging
log = "0.4"
clap_complete = "4.6.2"
clap_complete_nushell = "4.6.0"

# windows default nameserver determination
[target.'cfg(windows)'.dependencies]
ipconfig = { version = "0.3" }

[build-dependencies]
clap = "4"
clap_complete = "4.6.2"
clap_complete_nushell = "4.6.0"

[dev-dependencies]
pretty_assertions = "1.4"
