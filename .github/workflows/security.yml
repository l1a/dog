name: Security Audit

on:
  push:
    branches: [ master ]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [ master ]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/security.yml'
  schedule:
    # Weekly, Sunday 00:00 UTC: advisories are published against dependencies that did not change.
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo audit
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1
