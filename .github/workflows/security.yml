name: Security Audit

on:
  push:
    branches: [ master ]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [ master ]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/security.yml'
  schedule:
    # Weekly, Sunday 00:00 UTC: advisories are published against dependencies that did not change.
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run cargo audit
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1
