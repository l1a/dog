name: Security Audit

on:
  push:
    branches: [ master ]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [ master ]
  schedule:
    # Weekly, Sunday 00:00 UTC: advisories are published against dependencies that did not change.
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides whether this PR has anything for the jobs below to check. Not `on.pull_request.paths`,
  # which cannot tell the version bump every PR makes from a real change to Cargo.toml and
  # Cargo.lock: see scripts/path_filter.py. The patterns it uses are the `push` paths above.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/path_filter.py .github/workflows/security.yml

  audit:
    name: cargo audit
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Run cargo audit
        uses: actions-rust-lang/audit@v1
