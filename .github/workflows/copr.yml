name: COPR Rebuild

# Rebuilds kentobias/dog on COPR when a release is tagged, and pushes the COPR project page
# text from packaging/copr/project-*.md.

on:
  push:
    tags: [ "v[0-9]*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 90
    steps:
      - name: Install dependencies
        run: dnf -y install copr-cli git python3

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Guard - tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version=$(python3 scripts/render_packaging.py --print-version)
          if [ "v${version}" != "${GITHUB_REF_NAME%%-*}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Configure copr-cli
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COPR_LOGIN:-}" ] || [ -z "${COPR_TOKEN:-}" ] || [ -z "${COPR_USERNAME:-}" ]; then
            if [ "${GITHUB_REPOSITORY:-}" != "l1a/dog" ]; then
              echo "::notice::Fork (${GITHUB_REPOSITORY:-}); skipping COPR rebuild without credentials."
              echo "skip=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::COPR secrets (COPR_LOGIN, COPR_USERNAME, COPR_TOKEN) are not configured on l1a/dog."
            exit 1
          fi
          mkdir -p ~/.config
          {
            echo "[copr-cli]"
            echo "login = $COPR_LOGIN"
            echo "username = $COPR_USERNAME"
            echo "token = $COPR_TOKEN"
            echo "copr_url = https://copr.fedorainfracloud.org"
          } > ~/.config/copr
          chmod 600 ~/.config/copr
          echo "skip=false" >> "$GITHUB_ENV"

      - name: Update the COPR project page
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          copr-cli modify dog \
            --description "$(cat packaging/copr/project-description.md)" \
            --instructions "$(cat packaging/copr/project-instructions.md)"

      - name: Trigger and wait for COPR build from exact ref
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME:-master}"
          echo "Building kentobias/dog from commit/ref: $REF"
          copr-cli buildscm \
            --clone-url https://github.com/l1a/dog.git \
            --commit "$REF" \
            --method make_srpm \
            kentobias/dog
