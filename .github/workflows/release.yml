name: Release

# Pushing a `v*` tag builds, tests, packages and publishes a release.
# `workflow_dispatch` runs everything EXCEPT the publish and prune steps, so the pipeline can be
# exercised from a branch without creating a release; the archives land in the run's artifacts.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag and lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          if [ "$base" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Cargo.lock and man page are up to date
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          python3 scripts/man_pages.py --check

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read

  build:
    name: Build (${{ matrix.suffix }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    suffix: linux-x86_64 }
          - { os: ubuntu-24.04-arm, suffix: linux-aarch64 }
          - { os: macos-latest,     suffix: macos-aarch64 }
          - { os: windows-latest,   suffix: windows-x86_64 }
          - { os: windows-11-arm,   suffix: windows-aarch64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="dog-${GITHUB_REF_NAME}-${{ matrix.suffix }}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || name="dog-dev-${{ matrix.suffix }}"
          mkdir -p "dist/$name"/{bin,man,completions}
          cp target/release/dog "dist/$name/bin/"
          cp man/dog.1 "dist/$name/man/"
          cp LICENSE README.md "dist/$name/"
          bin=target/release/dog
          "$bin" --completions bash       > "dist/$name/completions/dog.bash"
          "$bin" --completions zsh        > "dist/$name/completions/_dog"
          "$bin" --completions fish       > "dist/$name/completions/dog.fish"
          "$bin" --completions powershell > "dist/$name/completions/_dog.ps1"
          "$bin" --completions elvish     > "dist/$name/completions/dog.elv"
          "$bin" --completions nushell    > "dist/$name/completions/dog.nu"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          ls -l dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "dog-$env:GITHUB_REF_NAME-${{ matrix.suffix }}"
          if ($env:GITHUB_REF_TYPE -ne 'tag') { $name = "dog-dev-${{ matrix.suffix }}" }
          $d = "dist/$name"
          New-Item -ItemType Directory -Force -Path "$d/bin", "$d/man", "$d/completions" | Out-Null
          Copy-Item target/release/dog.exe "$d/bin/"
          Copy-Item man/dog.1 "$d/man/"
          Copy-Item LICENSE, README.md $d
          $bin = 'target/release/dog.exe'
          foreach ($pair in @(@('powershell', '_dog.ps1'), @('bash', 'dog.bash'), @('zsh', '_dog'),
                              @('fish', 'dog.fish'), @('elvish', 'dog.elv'), @('nushell', 'dog.nu'))) {
            & $bin --completions $pair[0] | Out-File -Encoding utf8 "$d/completions/$($pair[1])"
            if ($LASTEXITCODE -ne 0) { throw "completions for $($pair[0]) failed" }
          }
          Compress-Archive -Path $d -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force $d
          Get-ChildItem dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.suffix }}
          path: dist/*

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prune:
    name: Prune old releases
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete releases beyond the 20 most recent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 1000 --json tagName --jq '.[20:][].tagName' \
            | while IFS= read -r tag; do
                [ -n "$tag" ] && gh release delete --yes --cleanup-tag -- "$tag"
              done
