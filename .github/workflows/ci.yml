name: CI

# Runs on every PR to master and every push to master.
#
# A docs-only PR does not run the full suite, but this is NOT done with `paths:` filters. Branch
# protection requires the single `CI OK` job, and a workflow filtered out by `paths:` never reports
# a status, so a docs-only PR would wait on a required check forever. Instead this workflow always
# runs, a `changes` job classifies the PR's files (scripts/ci_changes.py), and `lints`, `test` and
# `man` are skipped with `if:` when they are not needed. `CI OK` still runs every time, recomputes
# the classification itself, and fails if a job this change needs was skipped, so a
# misclassification cannot hide a skipped check (scripts/ci_gate.py).
#
#   docs-only  Markdown at the repository root, LICENSE, the screenshot, issue and PR templates:
#              nothing is built or tested.
#   man        man/ changed: only `Man page` runs.
#   code       anything else, including every workflow file: the full suite runs.
#
# Only pull requests take the fast path. A push to master, a release (workflow_call) and a manual
# run always run everything, and so does any doubt (an API error, an empty or truncated file list).

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  # Lets release.yml run this exact suite before it builds anything.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to the same PR supersedes the older run; never cancel runs on master itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      man: ${{ steps.classify.outputs.man }}
    steps:
      - uses: actions/checkout@v7

      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci_changes.py

  lints:
    name: Format and Clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      # Same invocation as `just clippy`, so a green local `just` means a green CI.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm }
          - { name: fedora-x86_64,  os: ubuntu-latest, container: "fedora:latest" }
          - { name: macos-aarch64,  os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
          - { name: windows-aarch64, os: windows-11-arm }
    steps:
      # gcc: ring compiles C. git: build.rs no longer needs it, but actions/checkout clones with it when
      # present (and only downloads an archive without it), and the Fedora image does not ship it.
      - name: Install dependencies (Fedora)
        if: matrix.container
        run: dnf install -y git gcc

      - uses: actions/checkout@v7

      # dtolnay/rust-toolchain does not work inside a bare container, so Fedora uses rustup.
      - name: Install Rust (Fedora)
        if: matrix.container
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        if: ${{ !matrix.container }}
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --workspace --locked --verbose

      # None of these touch the network: a live DNS query would make CI depend on the
      # runner's resolver, not on this code.
      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet -- --version
          cargo run --quiet -- --help > /dev/null
          for shell in bash zsh fish; do
            out=$(cargo run --quiet -- --completions "$shell")
            [ -n "$out" ] || { echo "no $shell completions"; exit 1; }
          done

  man:
    name: Man page
    needs: changes
    if: needs.changes.outputs.man == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build the man page
        run: just man

      # An empty or truncated file (a failed pandoc leaves one behind) has no .TH header.
      - name: Check the man page is valid roff
        run: |
          grep -q '^\.TH' target/man/dog.1
          man -l target/man/dog.1 > /dev/null

  # The single status check that branch protection requires. All of the logic is in
  # scripts/ci_gate.py, which has a self-test and is documented there. In short:
  #
  #   * it asks the API what every job ACTUALLY concluded, and does not rely on `needs.*.result`
  #     alone: a job cancelled in the runner queue reports `abandoned`, which the original gate did
  #     not recognise, so it passed a run whose jobs had all been cancelled (GitHub Actions outage,
  #     2026-10-05);
  #   * it recomputes the change classification itself, so a job a code change needs but that was
  #     SKIPPED fails: that is how a misclassification would hide;
  #   * it fails CLOSED: an API error, a job group missing from the run, a `changes` job that did
  #     not succeed, or any result it does not recognise all fail it.
  #
  # `if: always()` is still needed, or a failed dependency would SKIP this job and a skipped
  # required check counts as passing.
  ci-ok:
    name: CI OK
    if: always()
    needs: [ changes, lints, test, man ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Lets the job read this run's job list and the PR's file list. When release.yml calls this
    # workflow, the caller must grant the same, because a called workflow cannot widen its caller's token.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      EVENT_NAME: ${{ github.event_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify the jobs this change needs ran, and that every job succeeded
        run: python3 scripts/ci_gate.py
