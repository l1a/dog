name: CI

# Runs on every PR to master and every push to master.
#
# There are deliberately NO `paths:` filters here. Branch protection requires the final
# `CI OK` job, and a filtered-out workflow never reports a status, so a docs-only PR would
# wait on a required check forever. The whole suite is cheap enough to run every time.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  # Lets release.yml run this exact suite before it builds anything.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to the same PR supersedes the older run; never cancel runs on master itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lints:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      # Same invocation as `just clippy`, so a green local `just` means a green CI.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm }
          - { name: fedora-x86_64,  os: ubuntu-latest, container: "fedora:latest" }
          - { name: macos-aarch64,  os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
          - { name: windows-aarch64, os: windows-11-arm }
    steps:
      # build.rs shells out to `git`, and the Fedora image does not ship it.
      - name: Install dependencies (Fedora)
        if: matrix.container
        run: dnf install -y git gcc

      - uses: actions/checkout@v6

      # dtolnay/rust-toolchain does not work inside a bare container, so Fedora uses rustup.
      - name: Install Rust (Fedora)
        if: matrix.container
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        if: ${{ !matrix.container }}
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --workspace --locked --verbose

      # None of these touch the network: a live DNS query would make CI depend on the
      # runner's resolver, not on this code.
      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet -- --version
          cargo run --quiet -- --help > /dev/null
          for shell in bash zsh fish; do
            cargo run --quiet -- --completions "$shell" | head -n 1 > /dev/null
          done

  man:
    name: Man page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: extractions/setup-just@v3

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build the man page
        run: just man

      # An empty or truncated file (a failed pandoc leaves one behind) has no .TH header.
      - name: Check the man page is valid roff
        run: |
          grep -q '^\.TH' target/man/dog.1
          man -l target/man/dog.1 > /dev/null

  # The single status check that branch protection requires.
  #
  # This asks the API what every job in the run ACTUALLY concluded, and does not rely on
  # `needs.*.result` alone. The original gate tested that for `cancelled`, but a job cancelled in
  # the runner queue reports `abandoned`, so it passed a run whose Format and Clippy, Man page and
  # Fedora jobs had all been cancelled (GitHub Actions outage, 2026-10-05). The run's own
  # conclusion was correctly `failure`; only the job-level check was wrong, and branch protection
  # trusts the job.
  #
  # It fails CLOSED: an API error, an empty listing, or a missing group of jobs all fail it.
  # `if: always()` is still needed, or a failed dependency would SKIP this job and a skipped
  # required check counts as passing.
  ci-ok:
    name: CI OK
    if: always()
    needs: [ lints, test, man ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Lets the job read this run's job list. When release.yml calls this workflow, the caller
    # must grant `actions: read` too, because a called workflow cannot widen its caller's token.
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Verify every job in this run succeeded
        run: |
          set -euo pipefail

          # Anything other than `success` fails, not a list of known-bad words: a job cancelled in
          # the runner queue reports `abandoned`, which is not `failure`, `cancelled` or `skipped`.
          echo "needs results: ${NEEDS_RESULTS}"
          for r in ${NEEDS_RESULTS}; do
            if [ "$r" != "success" ]; then
              echo "::error::a dependency ended as '${r}', not 'success' (${NEEDS_RESULTS})"
              exit 1
            fi
          done

          jobs=$(gh api --paginate "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | [.name, (.conclusion // .status)] | @tsv')
          echo "jobs in this run:"
          printf '%s\n' "$jobs"

          # Judge only the jobs this workflow defines, and never this job itself. When another
          # workflow calls this one, GitHub prefixes the names ("CI / Test (...)").
          printf '%s\n' "$jobs" | awk -F'\t' '
            $1 ~ /(^| \/ )Format and Clippy$/ { lints++; counted = 1 }
            $1 ~ /(^| \/ )Man page$/           { man++;   counted = 1 }
            $1 ~ /(^| \/ )Test \(.*\)$/        { tests++; counted = 1 }
            counted {
              if ($2 != "success") { bad++; printf "::error::%s concluded %s\n", $1, $2 }
              counted = 0
            }
            END {
              if (!lints || !man || !tests) {
                printf "::error::expected lint, test and man jobs, found %d/%d/%d\n", lints, tests, man
                exit 1
              }
              if (bad) exit 1
              printf "all %d jobs succeeded\n", lints + man + tests
            }'
