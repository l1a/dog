name: CI

# Runs on every PR to master and every push to master.
# Branch protection requires the single `CI OK` job (`scripts/ci_gate.py`).

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  # Lets release.yml run this exact suite before it builds anything.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to the same PR supersedes the older run; never cancel runs on master itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lints:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Offline script and repository guards
        run: |
          python3 scripts/install_completions.py --self-test
          python3 scripts/install_man.py --self-test
          python3 scripts/gate_conformance.py --self-test
          python3 scripts/gate_conformance.py Justfile
          python3 scripts/render_packaging.py --self-test
          python3 scripts/copr_check.py --self-test
          python3 scripts/copr_check.py
          python3 scripts/version_gate.py --self-test
          python3 scripts/ci_gate.py --self-test
          python3 scripts/branch_gate.py --self-test
          python3 scripts/metadata_check.py --self-test
          python3 scripts/github_metadata.py --self-test
          python3 scripts/metadata_check.py
          python3 scripts/text_check.py --self-test
          python3 scripts/text_check.py
          python3 scripts/reset_wip.py --self-test

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,    os: ubuntu-latest }
          - { name: linux-aarch64,   os: ubuntu-24.04-arm }
          - { name: fedora-x86_64,   os: ubuntu-latest, container: "fedora:latest" }
          - { name: macos-aarch64,   os: macos-latest }
          - { name: windows-x86_64,  os: windows-latest }
          - { name: windows-aarch64, os: windows-11-arm }
    steps:
      - name: Install dependencies (Fedora)
        if: matrix.container
        run: dnf install -y git gcc rust cargo

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        if: ${{ !matrix.container }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --workspace --locked --verbose

      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet -- --version
          cargo run --quiet -- --help > /dev/null
          for shell in bash zsh fish; do
            out=$(cargo run --quiet -- --completions "$shell")
            [ -n "$out" ] || { echo "no $shell completions"; exit 1; }
          done

      - name: Smoke test a real DNS query
        shell: bash
        run: bash scripts/smoke_dns.sh

  man:
    name: Man page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mandown for man-page render verification
        run: cargo install --locked mandown

      - name: Verify committed man page matches Cargo.toml and is valid roff
        run: |
          python3 scripts/man_pages.py --self-test
          python3 scripts/man_pages.py --check
          grep -q '^\.TH' man/dog.1
          man -l man/dog.1 > /dev/null

  ci-ok:
    name: CI OK
    if: always()
    needs: [ lints, test, man ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every CI job group ran and succeeded
        run: python3 scripts/ci_gate.py
