name: Packaging

# Verifies the packaging templates. Not a required check, so it MAY use path filters (unlike
# ci.yml): a PR that does not touch packaging has nothing for it to verify.

on:
  push:
    branches: [ master ]
    paths:
      - 'packaging/**'
      - '.copr/**'
      - 'scripts/*_check.py'
      - 'scripts/render_packaging.py'
      - 'scripts/publish_packaging.py'
      - 'man/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Justfile'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/copr.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'packaging/**'
      - '.copr/**'
      - 'scripts/*_check.py'
      - 'scripts/render_packaging.py'
      - 'scripts/publish_packaging.py'
      - 'man/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Justfile'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/copr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  render:
    name: Renderer self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: |
          python3 scripts/render_packaging.py --self-test
          python3 scripts/publish_packaging.py --self-test
          python3 scripts/copr_check.py --self-test
          python3 scripts/copr_check.py
          python3 scripts/scoop_check.py --self-test
          python3 scripts/scoop_check.py

  copr:
    name: COPR build (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 45
    steps:
      - name: Install dependencies
        run: dnf -y install make git rpm-build python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the SRPM as COPR does
        run: make -f .copr/Makefile srpm outdir=/tmp/srpm

      - name: The SRPM carries the version Cargo.toml says
        run: |
          set -euo pipefail
          version=$(python3 scripts/render_packaging.py --print-version)
          srpm=$(find /tmp/srpm -name '*.src.rpm' -print -quit)
          [ -n "$srpm" ] || { echo "::error::no .src.rpm was produced"; exit 1; }
          echo "Cargo.toml: $version   built: $(basename "$srpm")"
          case "$(basename "$srpm")" in
            dog-"$version"-*.src.rpm) ;;
            *) echo "::error::SRPM name does not carry Cargo.toml's version ($version)"; exit 1 ;;
          esac

      - name: Install build dependencies
        run: dnf -y builddep /tmp/srpm/*.src.rpm

      - name: Rebuild the SRPM into an RPM
        run: rpmbuild --rebuild /tmp/srpm/*.src.rpm

      - name: The RPM contains what it should, and runs
        run: |
          set -euo pipefail
          top=$(rpm --eval '%{_topdir}')
          rpm=$(find "$top/RPMS" -name 'dog-[0-9]*.rpm' -print -quit)
          [ -n "$rpm" ] || { echo "::error::no binary RPM under $top/RPMS"; exit 1; }
          rpm -qlp "$rpm"
          for f in /usr/bin/dog /usr/share/man/man1/dog.1.gz \
                   /usr/share/bash-completion/completions/dog \
                   /usr/share/zsh/site-functions/_dog \
                   /usr/share/fish/vendor_completions.d/dog.fish; do
            rpm -qlp "$rpm" | grep -qx "$f" || { echo "::error::the RPM is missing $f"; exit 1; }
          done
          rpm -ivh --nodeps --nosignature "$rpm"
          version=$(python3 scripts/render_packaging.py --print-version)
          dog --version | tee /dev/stderr | grep -q "v$version"

  aur:
    name: AUR (Arch)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git python

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render PKGBUILD and .SRCINFO
        run: |
          set -euo pipefail
          mkdir -p /tmp/aur
          sha=$(python3 -c 'print("0" * 64)')
          python3 scripts/render_packaging.py --target aur-pkgbuild --version 0.0.1 --sha256 "$sha" --out /tmp/aur/PKGBUILD
          python3 scripts/render_packaging.py --target aur-srcinfo  --version 0.0.1 --sha256 "$sha" --out /tmp/aur/SRCINFO.rendered

      - name: .SRCINFO matches what makepkg generates
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder /tmp/aur
          su builder -c 'cd /tmp/aur && makepkg --printsrcinfo > SRCINFO.generated'
          diff -u /tmp/aur/SRCINFO.rendered /tmp/aur/SRCINFO.generated
          echo ".SRCINFO matches"

  homebrew:
    name: Homebrew formula
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # main

      - name: Render the formula into a local tap
        run: |
          set -euo pipefail
          brew tap-new l1a/test --no-git
          sha=$(python3 -c 'print("0" * 64)')
          python3 scripts/render_packaging.py --target brew --version 0.0.1 --sha256 "$sha" \
            --out "$(brew --repository l1a/test)/Formula/dog.rb"

      - name: Trust the throwaway formula
        run: brew trust --formula l1a/test/dog

      - name: Audit
        run: brew audit --strict --formula l1a/test/dog

      - name: Point --HEAD at this checkout for the build test
        run: |
          set -euo pipefail
          git checkout -B master HEAD
          formula="$(brew --repository l1a/test)/Formula/dog.rb"
          python3 -c '
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          ws = sys.argv[2]
          t = p.read_text()
          new = t.replace(
              "head \"https://github.com/l1a/dog.git\", branch: \"master\"",
              f"head \"file://{ws}\", using: :git, branch: \"master\"",
          )
          assert new != t, "head line not found in rendered formula"
          p.write_text(new)
          ' "$formula" "$GITHUB_WORKSPACE"

      - name: Install from source
        run: brew install --HEAD --verbose l1a/test/dog

      - name: Test
        run: brew test l1a/test/dog

  scoop:
    name: Scoop manifest (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scoop manifest template is valid (offline)
        shell: bash
        run: python scripts/scoop_check.py --self-test && python scripts/scoop_check.py

      - name: Render the Scoop manifest for the last released tag
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "::error::no tags in this checkout — cannot render a Scoop manifest to install"
            exit 1
          fi
          VER="${TAG#v}"
          BASE_URL="https://github.com/l1a/dog/releases/download/${TAG}"
          echo "last released tag: $TAG"
          WORK="$(mktemp -d)"
          curl -sfL --retry 3 -o "$WORK/dog-${TAG}-windows-x86_64.zip" "$BASE_URL/dog-${TAG}-windows-x86_64.zip" \
            || { echo "::error::cannot fetch $BASE_URL/dog-${TAG}-windows-x86_64.zip"; exit 1; }
          curl -sfL --retry 3 -o "$WORK/dog-${TAG}-windows-aarch64.zip" "$BASE_URL/dog-${TAG}-windows-aarch64.zip" \
            || { echo "::error::cannot fetch $BASE_URL/dog-${TAG}-windows-aarch64.zip"; exit 1; }
          SHA_X64=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest(),end='')" "$WORK/dog-${TAG}-windows-x86_64.zip")
          SHA_ARM=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest(),end='')" "$WORK/dog-${TAG}-windows-aarch64.zip")
          echo "computed x86_64 sha256: $SHA_X64"
          echo "computed arm64  sha256: $SHA_ARM"
          python scripts/render_packaging.py --target scoop --version "$VER" \
            --sha256-x86-64 "$SHA_X64" --sha256-arm64 "$SHA_ARM" \
            --out "$RUNNER_TEMP/dog.json"
          python - "$RUNNER_TEMP/dog.json" "$VER" "$SHA_X64" "$SHA_ARM" <<'PY'
          import json, pathlib, sys
          path, ver, sha_x64, sha_arm = sys.argv[1:]
          data = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          assert data["version"] == ver, f"version {data['version']!r} != {ver!r}"
          assert data["architecture"]["64bit"]["hash"] == sha_x64
          assert data["architecture"]["arm64"]["hash"] == sha_arm
          assert data["architecture"]["64bit"]["url"].endswith(f"/v{ver}/dog-v{ver}-windows-x86_64.zip")
          assert data["architecture"]["arm64"]["url"].endswith(f"/v{ver}/dog-v{ver}-windows-aarch64.zip")
          assert data["architecture"]["64bit"]["extract_dir"] == f"dog-v{ver}-windows-x86_64"
          assert data["architecture"]["arm64"]["extract_dir"] == f"dog-v{ver}-windows-aarch64"
          PY
          echo "RENDERED_VER=$VER" >> "$GITHUB_ENV"
          rm -rf "$WORK"
          echo "render verified against the real $TAG Windows release archives"

      - name: Install via Scoop from a staged local bucket and verify binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process -Force
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
            $env:PATH = "$HOME\scoop\shims;$env:PATH"
          }
          $bucketDir = Join-Path $HOME "scoop\buckets\local-test\bucket"
          New-Item -ItemType Directory -Force -Path $bucketDir | Out-Null
          Copy-Item "$env:RUNNER_TEMP\dog.json" (Join-Path $bucketDir "dog.json")
          scoop install local-test/dog
          if ($LASTEXITCODE -ne 0) {
            throw "scoop install local-test/dog failed with exit code $LASTEXITCODE"
          }
          $verOut = (& dog --version) -join " "
          if ($LASTEXITCODE -ne 0) {
            throw "dog --version failed with exit code $LASTEXITCODE"
          }
          Write-Host "dog --version: $verOut"
          if ($verOut -notmatch [regex]::Escape($env:RENDERED_VER)) {
            throw "Expected dog --version to contain $($env:RENDERED_VER), got: $verOut"
          }
