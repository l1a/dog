name: Metadata

# Checks that every copy of dog's project description agrees with packaging/metadata.toml, and that
# the README still carries the tagline.

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'README.md'
      - 'Cargo.toml'
      - 'packaging/**'
      - 'scripts/metadata_check.py'
      - 'scripts/github_metadata.py'
      - '.github/workflows/metadata.yml'
  push:
    branches: [ master ]
    paths:
      - 'README.md'
      - 'Cargo.toml'
      - 'packaging/**'
      - 'scripts/metadata_check.py'
      - 'scripts/github_metadata.py'
      - '.github/workflows/metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metadata-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    name: Description agrees everywhere
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - run: python3 scripts/metadata_check.py --self-test

      - run: python3 scripts/metadata_check.py
