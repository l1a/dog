name: Version bump

# Advisory: reports when a PR did not bump the version past master. It is NOT a required check
# (branch protection requires only `CI OK`), so it informs and does not block; `just merge-pr`
# does refuse to merge over any red check, this included.

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump:
    name: Version bumped
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Version is past master and the last tag, and Cargo.lock agrees
        run: python3 scripts/version_gate.py --base "origin/${BASE_REF}"
